[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system"
version = "1.0.0"
description = "A deterministic delivery runtime for coding agents"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "anthropic>=0.40.0",
    "claude-agent-sdk>=0.1.0; python_version>='3.10'",
]

[project.scripts]
workflow = "agent_system.cli:main"

[tool.setuptools.package-data]
agent_system = ["prompts/**/*.md"]

[tool.setuptools.packages.find]
where = ["src"]
